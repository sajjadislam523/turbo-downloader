<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Send to TurboDL</title>
    <style>
        body {
            margin: 0;
            width: 260px;
            background: #0a0a0a;
            color: #ddd;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        .wrap {
            padding: 14px;
        }
        h1 {
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0 0 10px;
            color: #c8ff00;
        }
        button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #3d4f00, #c8ff00 60%, #9cbf00);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.98);
        }
        p {
            font-size: 10px;
            color: #666;
            line-height: 1.5;
            margin: 10px 0 0;
        }
        #status {
            margin-top: 8px;
            font-size: 10px;
            color: #c8ff00;
            min-height: 12px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>TurboDL Ultra</h1>
        <button id="send">Send Current Tab</button>
        <div id="status"></div>
        <p>
            Opens a new tab that sends the link — your browser should then ask
            to open TurboDL Ultra automatically, or you can click a button on
            that tab. Choose "Always allow" the first time to skip the prompt
            next time. The desktop app must already be running or installed.
        </p>
    </div>
    <script src="popup.js"></script>
</body>
</html>
