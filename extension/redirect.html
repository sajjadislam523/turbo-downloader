<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Opening TurboDL Ultra…</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #ddd;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        .box {
            text-align: center;
            max-width: 420px;
            padding: 24px;
        }
        h1 {
            color: #c8ff00;
            font-size: 16px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 0 0 14px;
        }
        p {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
            margin: 6px 0;
        }
        #target {
            color: #aaa;
            word-break: break-all;
        }
        a.btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 22px;
            background: linear-gradient(90deg, #3d4f00, #c8ff00 60%, #9cbf00);
            color: #0a0a0a;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 12px;
        }
        #status {
            margin-top: 14px;
            font-size: 11px;
            color: #6699ff;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>TurboDL Ultra</h1>
        <p>Sending: <span id="target">—</span></p>
        <p>
            Your browser should ask to open TurboDL Ultra automatically, and
            this tab will then close itself. If no prompt appeared, click the
            button below — a real click is the most reliable way to trigger
            it, and also closes this tab.
        </p>
        <a class="btn" id="open-link" href="#">Open TurboDL Ultra</a>
        <p id="status"></p>
    </div>
    <script src="redirect.js"></script>
</body>
</html>
